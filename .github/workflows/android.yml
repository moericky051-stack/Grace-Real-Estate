.github/workflows/build-apk.yml: |
  name: Build Android APK
  
  on:
    push:
      branches: [ "main", "master" ]
    pull_request:
      branches: [ "main", "master" ]
    workflow_dispatch:
  
  jobs:
    build:
      runs-on: ubuntu-latest
  
      steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
  
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
  
      - name: Decode Keystore
        if: env.RELEASE_KEYSTORE != ''
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > my-upload-key.jks
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
  
      - name: Generate Dummy Keystore if missing
        run: |
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass password -keypass password -dname "CN=Developer, OU=Dev, O=Dev, L=City, ST=State, C=MM"
          fi
  
      - name: Create .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
  
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
  
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
  
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'password' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'password' }}
  
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
  
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
