# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE UI will override any settings in this file.

# Enable Gradle Daemon for faster builds
org.gradle.daemon=true

# JVM Options to prevent OutOfMemory errors during compilation
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable AndroidX and Jetifier
android.useAndroidX=true
android.enableJetifier=true

# Enable Non-transitive R classes to speed up builds
android.nonTransitiveRClass=true

# Disable problematic configuration caching for CI/CD compatibility
org.gradle.configuration-cache=false

# Bypass strict version and dependency configuration constraints during evaluation
android.overrideVersionCheck=true
android.suppressUnsupportedCompileSdk=36
